[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# CI gate — эти правила блокируют PR:
#   F   — pyflakes (неиспользуемые импорты, неопределённые имена и т.д.)
#   E4   — импорты (E401 — несколько на одной строке)
#   E7   — выражения/операторы (E711/E712 — сравнение с None/True/False, E741 — ambiguous names)
select = ["F", "E4", "E7"]

# E501 (длина строки) — отдельная постепенная миграция, не блокирует PR
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# В тестах допускаются неиспользуемые импорты (F401) и широкие except
"tests/*" = ["F401", "F811"]
