name: CI

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint (F, E4, E7)
        run: |
          python -m ruff check quickip --output-format=concise

      - name: Tests
        run: |
          python -m pytest tests/ -q --tb=short
